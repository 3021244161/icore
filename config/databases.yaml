# =============================================================================
# icore — Database Connection Configuration
# =============================================================================
# Define named database connections here. Each connection maps to a single
# database instance. The default_connection name determines which connection
# is used when TaskContext.get_db() is called without arguments.
#
# Supported db_type values:
#   - postgresql  (asyncpg driver)
#   - mysql       (aiomysql driver)
#   - oracle      (oracledb async driver)
#   - hive        (pyhive, sync -> wrapped via asyncio.to_thread)
#
# Reference: docs/03-database-layer.md
# =============================================================================

default_connection: "main_db"            # Name of the default connection

# -----------------------------------------------------------------------------
# Named Connections
# -----------------------------------------------------------------------------
connections:

  # --- Main PostgreSQL database ---
  main_db:
    db_type: "postgresql"
    host: "localhost"
    port: 5432
    username: "${DB_USER}"               # Use environment variable
    password: "${DB_PASSWORD}"
    database: "icore"
    pool_size: 10                        # Max concurrent connections
    max_overflow: 20                     # Extra overflow beyond pool_size
    pool_recycle: 3600                   # Connection recycle time (seconds)
    extra_params:                        # Driver-specific extra parameters
      sslmode: "prefer"
      application_name: "icore"

  # --- Oracle connection (for legacy systems) ---
  # legacy_oracle:
  #   db_type: "oracle"
