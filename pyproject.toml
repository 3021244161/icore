[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icore"
version = "1.0.0"
description = "icore - 企业级 LLM 工作流编排平台 (Coding-Driven Workflow Orchestration Platform)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "icore" }]
keywords = ["llm", "workflow", "orchestration", "dag", "fastapi", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Core web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # Data validation & configuration
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    # YAML config
    "PyYAML>=6.0",
    # Utilities
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
# Database drivers (install per datasource)
db = [
    "asyncpg>=0.29.0",        # PostgreSQL
    "aiomysql>=0.2.0",        # MySQL
    "oracledb>=2.2.0",        # Oracle
    "pyhive>=0.7.0",          # Hive
    "thrift>=0.16.0",
    "sasl>=0.3.1",
    "thrift-sasl>=0.4.3",
]
# Direct LLM SDK + token counting
llm = [
    "openai>=1.40.0",
    "tiktoken>=0.7.0",
]
# Model Context Protocol server
mcp = ["mcp>=1.0.0"]
# Streamlit UI
ui = ["streamlit>=1.36.0"]
# Everything optional
all = [
    "icore[db,llm,mcp,ui]",
]
# Development & testing
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.urls]
Documentation = "https://github.com/icore/icore/tree/main/docs"

[project.scripts]
icore = "icore.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["icore*"]
exclude = ["tests*", "docs*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:icore.*",
]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
