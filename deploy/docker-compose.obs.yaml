# icore — observability stack (Prometheus + Grafana + Jaeger + Loki).
#
# Layer on top of either docker-compose.yaml or docker-compose.full.yaml:
#
#     docker-compose -f deploy/docker-compose.full.yaml \
#                    -f deploy/docker-compose.obs.yaml up -d
#
# Endpoints:
#
#     Prometheus -> http://localhost:9090
#     Grafana    -> http://localhost:3000  (admin / admin)
#     Jaeger UI  -> http://localhost:16686
#     Loki       -> http://localhost:3100 (read by Grafana, not browsable)

version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: icore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: icore-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: icore-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: icore-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
