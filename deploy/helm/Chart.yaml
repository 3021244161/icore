apiVersion: v2
name: icore
description: |
  icore - 企业级 LLM 工作流编排平台 (Coding-Driven Workflow Orchestration).
  Helm chart for deploying icore + the v0.6 reference stack
  (PostgreSQL / Redis / Milvus / Neo4j / MinIO) on Kubernetes.
type: application
version: 0.6.0
appVersion: "1.0.0"
keywords:
  - llm
  - workflow
  - orchestration
  - dag
  - fastapi
home: https://github.com/icore/icore
maintainers:
  - name: icore
icon: ""
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: minio
    version: "14.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
